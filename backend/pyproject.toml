[project]
name = "flamesafe-ai-backend"
version = "0.1.0"
description = "AI-Powered Scientific Research & Fire Safety Intelligence Platform for NASA Microgravity Combustion Data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mohamed Gharieb", email = "gharieb@flamesafe.ai" },
    { name = "Toka Reda" },
    { name = "Mai Hamdy" },
    { name = "Amany Atef" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "pgvector>=0.3.6",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "PyMuPDF>=1.24.11",
    "httpx>=0.27.2",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "pyarrow>=18.0.0",
    "python-multipart>=0.0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
